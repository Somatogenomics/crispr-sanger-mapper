name: Core R tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Run dependency-free core tests
        run: Rscript tests/test_core.R
