# Official reusable workflow from posit-dev/r-shinylive (actions-v1 pattern).
name: Deploy Shinylive app to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

jobs:
  shinylive:
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    permissions:
      pages: write
      id-token: write
