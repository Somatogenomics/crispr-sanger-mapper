# Shinylive deployment is blocked unless base-R core tests pass.
# The reusable workflow exports the app and publishes static files to Pages.
name: Deploy Shinylive app to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Verify core alignment, PAM, cut mapping, and synthetic trace tests
        run: Rscript tests/test_core.R

  shinylive:
    needs: verify
    uses: posit-dev/r-shinylive/.github/workflows/deploy-app.yaml@actions-v1
    permissions:
      pages: write
      id-token: write
